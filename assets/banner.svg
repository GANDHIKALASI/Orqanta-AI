<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Orqanta AI - Gandhi Kalasi">
<style>
svg{--t0:0.0s}.s{animation-duration:9.0s;animation-iteration-count:infinite;animation-fill-mode:both;animation-delay:calc(0s - var(--t0))}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}2.22%{stroke-dashoffset:1}28.89%{stroke-dashoffset:0}93.33%{stroke-dashoffset:0;opacity:1}98.89%{opacity:0}100%{opacity:0;stroke-dashoffset:1}}
.draw{animation-name:draw;animation-timing-function:cubic-bezier(.4,0,.2,1)}
@keyframes word{0%{width:0}17.78%{width:0}32.22%{width:720px}93.33%{width:720px}98.89%{width:0}100%{width:0}}
.word{animation-name:word;animation-timing-function:steps(13,end)}
@keyframes tag{0%{opacity:0}42.22%{opacity:0}47.78%{opacity:1}93.33%{opacity:1}98.89%{opacity:0}100%{opacity:0}}
.tag{animation-name:tag}
@media (prefers-reduced-motion:reduce){.s{animation:none!important}.draw{stroke-dashoffset:0}.word{width:720px}.tag{opacity:1}}
</style>
<defs>
<clipPath id="cw"><rect class="s word" x="430" y="80" width="720" height="130"/></clipPath>
<clipPath id="avatar-clip"><circle cx="463" cy="365" r="24"/></clipPath>
<linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00f2fe"/>
  <stop offset="100%" stop-color="#4facfe"/>
</linearGradient>
<linearGradient id="insta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f09433"/>
  <stop offset="25%" stop-color="#e6683c"/>
  <stop offset="50%" stop-color="#dc2743"/>
  <stop offset="75%" stop-color="#cc2366"/>
  <stop offset="100%" stop-color="#bc1888"/>
</linearGradient>
</defs>
<rect width="1200" height="480" fill="#0b0f19"/>

<!-- Animated Logo -->
<g transform="translate(64 72) scale(0.37)">
<path class="s draw" d="M 272 848 L 272 545 C 272 534 262 530 222 530 A 190 190 0 0 1 32 340 L 32 170 A 64 64 0 0 1 160 170 L 160 340 C 160 372 187 399 219 399 L 272 399 L 272 207 A 175 175 0 0 1 623 207 L 623 620 C 623 645 640 655 665 655 L 736 655 L 736 432 A 64 64 0 0 1 864 432 L 864 640 A 163 163 0 0 1 701 803 L 655 803 C 636 803 623 815 623 835 L 623 848" fill="none" stroke="url(#glow)" stroke-width="64" stroke-linejoin="round" stroke-linecap="butt" pathLength="1" stroke-dasharray="1"/>
</g>

<!-- Animated Title (Orqanta AI) -->
<text x="430" y="175" font-family="Inter, -apple-system, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#ffffff" letter-spacing="-2" clip-path="url(#cw)">Orqanta AI</text>

<!-- About Orqanta AI -->
<text class="s tag" x="430" y="222" font-family="Inter, -apple-system, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#00f2fe" letter-spacing="1.5">121M EDGE FOUNDATION MODEL</text>
<text class="s tag" x="430" y="258" font-family="Inter, -apple-system, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1">Autonomous offline vehicle telemetry &amp; tool intelligence for Electric &amp; Petrol mobility</text>
<text class="s tag" x="430" y="288" font-family="Inter, -apple-system, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">Deterministic sub-50ms CPU execution · &lt;80MB peak RAM · 100% offline edge privacy</text>

<!-- Developer Profile Card Pill -->
<g class="s tag">
  <rect x="430" y="332" width="380" height="66" rx="33" fill="#111827" stroke="url(#glow)" stroke-width="1.5"/>
  
  <!-- Profile Picture -->
  <image href="data:image/jpeg;base64," x="439" y="341" width="48" height="48" clip-path="url(#avatar-clip)"/>
  <circle cx="463" cy="365" r="24" fill="none" stroke="#00f2fe" stroke-width="2"/>
  
  <!-- Developer Name -->
  <text x="496" y="358" font-family="Inter, -apple-system, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Gandhi Kalasi</text>
  
  <!-- Instagram Badge -->
  <g transform="translate(496, 368)">
    <rect x="0" y="0" width="16" height="16" rx="4.5" fill="none" stroke="url(#insta-grad)" stroke-width="1.6"/>
    <circle cx="8" cy="8" r="3.6" fill="none" stroke="url(#insta-grad)" stroke-width="1.6"/>
    <circle cx="12.2" cy="3.8" r="0.9" fill="#dc2743"/>
    <text x="22" y="12.5" font-family="Inter, -apple-system, &apos;Segoe UI&apos;, sans-serif" font-size="13.5" font-weight="500" fill="#f43f5e">@bug_gandhi</text>
  </g>
</g>
</svg>